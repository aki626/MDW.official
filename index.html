<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MDW - なかよく活動するWebサイト作成講座チーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ロード画面 -->
    <div id="loader">
        <div class="loader-box">
            <p class="loader-text">Loading...</p>
            <p id="loader-percent">0%</p>
        </div>
    </div>

    <!-- ヒーローヘッダー -->
    <header class="hero">
        <img class="logo" src="mdw-logo.jpeg.png" alt="MDWロゴ">
        <h1 class="title">MDW</h1>
        <p>みんな仲よく活動する</p>
    </header>

    <!-- メンバー一覧 -->
    <section class="members">
        <h2>Team Members</h2>

        <div class="member-card">
            <div class="icon">✦</div>
            <h3>あき</h3>
            <p>教える側 / デザイン担当</p>
            <p>使っているソフト：Github</p>
            <p>一言：これからよろしく！</p>
        </div>

        <div class="member-card">
            <div class="icon">⚚</div>
            <h3>二ガるメタル</h3>
            <p>教える側</p>
            <p>使っているソフト：Github</p>
            <p>一言：プログラミングって実は難しくないんやで、たのしいからみんなでやろう！！</p>
        </div>
    </section>

    <!-- About -->
    <section class="about">
        <h2>About MDW</h2>
        <p>
            MDWは「みんな仲よく」を大切にするWeb制作＆ゲーム活動チームです。<br>
            協力、交流、創作活動など、楽しく活動しています。<br><br>
        </p>

        <a class="join-button" href="https://openchat.line.me/jp/cover/vH0ZPsfZb97koToVOlrlb_AJPMq50wdPjY1A3ZEXmghF9zzEw5ma70KI6JQ" target="_blank">
            オープンチャットに参加
        </a>
    </section>

    <!-- フッター -->
    <footer>
        © 2026 MDW Team　オーナー あき / ニガるメタル
    </footer>

    <!-- ロード画面スクリプト（5秒で100%） -->
    <script>
        let percent = 0;
        const loaderPercent = document.getElementById("loader-percent");
        const loader = document.getElementById("loader");

        // 5秒で100% → 5000ms / 100 = 50msごとに1%進む
        const interval = setInterval(() => {
            percent++;
            loaderPercent.textContent = percent + "%";

            if (percent >= 100) {
                clearInterval(interval);
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 500);
            }
        }, 50);
    </script>

</body>
</html>
